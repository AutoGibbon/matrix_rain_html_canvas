<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>Matrix Rain</title>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}
			html,
			body {
				width: 100%;
				height: 100%;
				overflow: hidden;
				background: #000;
			}
			canvas {
				display: block;
				width: 100%;
				height: 100%;
			}
		</style>
	</head>
	<body>
		<canvas id="c"></canvas>
		<script>
			/* ──────────────────────────────────────────────────────────────────────────
			 * MATRIX RAIN — model overview
			 *
			 * Stateless. Every fragment computes its colour from (col, row, time)
			 * hashes. No buffers, no feedback textures, no JS-side simulation.
			 *
			 * Reference grounding. Parameters are tuned against close-up footage of
			 * the original film effect on CRT screens. The reference frame had ~24
			 * rows; we render at 54 rows (full screen height at 4K), with timing
			 * scaled proportionally. Cells are slightly taller than wide (0.80
			 * density) matching the original CRT aspect.
			 *
			 * Trails. Each column has an infinite Poisson-ish schedule of trails.
			 * Trail k in column c starts at Tk = k * TRAIL_GAP_MEAN - colPhase(c)
			 * + jitter(c, k). Head descends at TRAIL_SPEED cells/sec. trailRole()
			 * walks back through recent trails to find which one owns a cell and
			 * what role it plays: dead, eviction zone, head, body, or tail-fade.
			 * Newer trails' eviction zones wipe older trails' bodies. Eviction
			 * grows from 1 cell at trail arrival up to EVICT_LEN — avoids
			 * snapping a wide blank band into existence.
			 *
			 * Mutation. Every trail cell mutates at MUTATE_HZ (2 Hz). Per-cell
			 * phase staggering means cells never tick in unison. New glyph
			 * crossfades over old over CROSSFADE_TIME — phosphor-not-yet-decayed
			 * feel during the swap.
			 *
			 * Flash (two systems, max-combined):
			 *   - Head-arrival flash. Each cell flashes when the head first lands
			 *     on it. Decays continuously, so the cell immediately behind the
			 *     head inherits a partially-decayed flash rather than snapping to
			 *     baseline green. White → cyan → green ramp.
			 *   - Body map-gated flash. A scrolling per-cell hash gates whether
			 *     each body mutation flashes. Each cell holds its flash decision
			 *     stable for ~3s before re-rolling, with per-cell phase so the
			 *     re-roll moments are scattered. Blown-out green ramp, driven
			 *     into the bloom for phosphor-burn highlights.
			 *
			 * Dark field. Same map sample as the body flash gate, opposite end of
			 * [0,1]. Cells in the dim window darken instead of brightening on
			 * mutation. One hash drives both effects; the gates partition the
			 * map's value range.
			 *
			 * Layers. Two depth planes: foreground (depth 1.0) and background
			 * (depth 0.6 with BG_TRAIL_SCALE shorter trails). Composited
			 * foreground-over-background by alpha.
			 *
			 * Post-processing. Single-pass cross-kernel bloom — sceneAt() is
			 * called 5x (centre + 4 cross neighbours), weighted by luminance²
			 * so dim cells barely contribute. Then scanline + vertical mask.
			 *
			 * Breathing. Slow zoom oscillating in [1.0, 1.0+BREATHE_SCALE] — the
			 * minimum is the natural viewport, so breathing only zooms IN and
			 * never reveals content outside the natural screen extents.
			 *
			 * Per-cell stable variance. Body cells multiply by a stable per-cell
			 * hash in [1-BODY_BRIGHT_VAR, 1] to break the "every body cell is
			 * the same green" uniformity. Doesn't change over time.
			 *
			 * Resolution independence. Cell size derives from canvas height
			 * (REF_CELL pixels at REF_HEIGHT). All trail geometry is expressed
			 * in cells and seconds, never pixels. Bloom radius scales with
			 * resolution so cell-relative bleed is consistent. Column count
			 * scales naturally with aspect ratio.
			 *
			 * Tuning hotspots: TRAIL_GAP_MEAN/VAR (column density and burstiness),
			 * FLASH_PROB / DARK_PROB (body flash/dim fraction), FLASH_BOOST and
			 * FLASH_BOOST_TAIL (flash brightness, drive bloom), BLOOM_STRENGTH
			 * (phosphor halo intensity), COL_DENSITY (horizontal column packing).
			 * ──────────────────────────────────────────────────────────────────────── */

			const canvas = document.getElementById("c");
			const gl = canvas.getContext("webgl2");
			if (!gl) {
				document.body.innerHTML = '<p style="color:lime;font-family:monospace;padding:2em">WebGL2 not supported</p>';
			}

			// ── Build glyph atlas ─────────────────────────────────────────────────────────
			// 32x32 grid of 64x64px cells = 2048x2048 texture, 1024 glyph slots.
			// Glyph set: Katakana (normal + mirrored), Latin A-Z a-z 0-9.
			// Glyphs are Fisher-Yates shuffled before layout so adjacent atlas slots are
			// from mixed character sets -- prevents noise-driven clustering showing runs
			// of the same script. With <1024 unique glyphs the list is repeated to fill.
			function buildGlyphTexture() {
				const COLS = 32,
					ROWS = 32,
					CELL = 64;
				const W = COLS * CELL,
					H = ROWS * CELL;
				const oc = document.createElement("canvas");
				oc.width = W;
				oc.height = H;
				const ctx = oc.getContext("2d");
				ctx.fillStyle = "#000";
				ctx.fillRect(0, 0, W, H);
				ctx.textAlign = "center";
				ctx.textBaseline = "middle";

				const glyphs = []; // { ch, mirror }

				const addRange = (from, to, mirror) => {
					for (let c = from; c <= to; c++) glyphs.push({ ch: String.fromCharCode(c), mirror: !!mirror });
				};
				const addStr = (s, mirror) => {
					for (const ch of s) glyphs.push({ ch, mirror: !!mirror });
				};

				// Katakana -- normal and mirrored (Whiteley's original technique)
				addRange(0x30a0, 0x30ff, false);
				addRange(0x30a0, 0x30ff, true);

				// Latin + digits
				addStr("ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789", false);

				// Blank slots — when a mutation lands on one of these, the cell renders empty,
				// creating gaps in the column. The film reference is sparse, so we want a
				// meaningful share. BLANK_FRACTION = fraction of final atlas that is blank.
				const BLANK_FRACTION = 0.3;
				const blankCount = Math.round((glyphs.length * BLANK_FRACTION) / (1 - BLANK_FRACTION));
				for (let i = 0; i < blankCount; i++) glyphs.push({ ch: " ", mirror: false });

				// Repeat to fill 1024 slots so atlas is fully used and no padding glyph
				// dominates. Keep a copy of the unique set first; tile after.
				const unique = glyphs.slice();
				while (glyphs.length < 1024) {
					glyphs.push(unique[glyphs.length % unique.length]);
				}
				glyphs.length = 1024;

				// Fisher-Yates shuffle with a fixed seed (lcg) for determinism
				let seed = 1337;
				const rng = () => {
					seed = (seed * 1664525 + 1013904223) >>> 0;
					return seed / 0x100000000;
				};
				for (let i = glyphs.length - 1; i > 0; i--) {
					const j = Math.floor(rng() * (i + 1));
					[glyphs[i], glyphs[j]] = [glyphs[j], glyphs[i]];
				}

				const SZ = CELL * 0.78;

				for (let i = 0; i < 1024; i++) {
					const { ch, mirror } = glyphs[i];
					const col = i % COLS,
						row = Math.floor(i / COLS);
					const cx = col * CELL + CELL * 0.5;
					const cy = row * CELL + CELL * 0.5;
					ctx.save();
					ctx.font = "bold " + SZ + "px monospace";
					ctx.fillStyle = "#fff";
					if (mirror) {
						ctx.translate(cx, cy);
						ctx.scale(-1, 1);
						ctx.fillText(ch, 0, 0);
					} else {
						ctx.fillText(ch, cx, cy);
					}
					ctx.restore();
				}

				const tex = gl.createTexture();
				gl.bindTexture(gl.TEXTURE_2D, tex);
				gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, oc);
				gl.generateMipmap(gl.TEXTURE_2D);
				gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
				gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
				gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
				gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
				return tex;
			}

			// ─── Shaders ─────────────────────────────────────────────────────────────────
			const VS = `#version 300 es
in vec2 aPos;
void main() { gl_Position = vec4(aPos, 0.0, 1.0); }
`;

			const FS = `#version 300 es
precision highp float;

uniform vec2  iResolution;
uniform float iTime;
uniform sampler2D iChannel0; // glyph atlas  (32x32 grid -> 1024 glyphs, shuffled)

out vec4 fragColor;

// Resolution-relative cell sizing. REF_CELL is the desired vertical glyph
// cell size at REF_HEIGHT pixels of canvas height. At any other height,
// cell size scales proportionally so glyphs occupy the same fraction of
// the screen vertically. Horizontal column spacing is squashed by
// COL_DENSITY so columns can pack tighter than glyphs are tall.
// At 4K (2160 tall): cellH = 40, cellW = 40 * COL_DENSITY, giving 54 rows.
// At 1080p: cellH = 20, still 54 rows. Column count derives from
// canvas width / cellW, so ultrawide displays naturally get more columns.
#define REF_CELL          32.0    // reference cell size in pixels at REF_HEIGHT (vertical)
#define REF_HEIGHT        2160.0  // reference canvas height in pixels (4K)
#define COL_DENSITY       0.80    // horizontal column spacing as fraction of vertical cell size — glyphs render taller than wide, matching the original CRT aesthetic where pixels were often non-square
#define COLOR             vec3(0.2, 1.0, 0.45) // base RGB colour of the rain — tint the whole effect here

// --- Trail geometry (foreground layer) --------------------------------------
// Trails are discrete: a contiguous run of cells that scrolls down a column.
// Each column has an infinite sequence of trails arriving on a Poisson-ish
// schedule. Only cells inside a live trail render; everything else is black.
//
// Geometry, in cells (foreground depth = 1.0):
//   * Eviction buffer: EVICT_LEN cells immediately ahead of the head, forced
//     blank. Wipes any leftover state before the head arrives. ~20% screen.
//   * Head: 1 cell at the leading edge, always flashes on print.
//   * Body: TRAIL_LEN - FADE_LEN cells of full green, mutating at MUTATE_HZ.
//   * Tail fade: FADE_LEN cells linearly fading green to black.
//
// At 4K, cellH derives to 40px, giving 54 rows. Trail spans the screen.
#define TRAIL_LEN         54.0    // total trail length in cells (head + body + fade) — ~1 screen height at 4K
#define TRAIL_LEN_VAR     0.20    // per-trail length jitter as fraction of TRAIL_LEN — 0.20 = ±20% length variation
#define EVICT_LEN         11.0    // eviction buffer in cells ahead of the head — forced blank, wipes stale state
#define FADE_LEN          3.0     // tail fade in cells — last N cells of trail fade green to black before evicting

// --- Trail scheduling --------------------------------------------------------
// Trails advance one cell every TRAIL_FRAME_INTERVAL frames at 30fps. Speed
// is uniform across columns (no per-column variance — the reference shows
// uniform fall speed). New trails arrive in a column on average every
// TRAIL_GAP_MEAN seconds; gap variance is large so some columns are dense,
// some sparse.
//
// Reference observation: in the film, a 24-row CRT had new trails arriving
// every ~4s, while a trail traverses 24 rows in 4s at this speed. So gap
// roughly equals traversal time, meaning ~1 trail alive per column on
// average. Our 54-row screen takes 9s to traverse, so gap is scaled
// proportionally: 9s mean, ~6.5s variance.
#define TRAIL_SPEED       6.5     // cells per second downward — 1 cell per 5 frames at 30fps
#define TRAIL_GAP_MEAN    24.0     // mean seconds between trail arrivals in a single column
#define TRAIL_GAP_VAR     9.5     // gap variance — higher = more bursty
#define TRAIL_LOOKBACK    5       // how many recent trails to test per fragment

// --- Glyph mutation model ----------------------------------------------------
// Every body/fade/head cell mutates at MUTATE_HZ with per-cell phase
// staggering and banded rate jitter. Jitter is gated: cells whose hash
// magnitude falls below MUTATE_JITTER_THRESHOLD run at exactly the base
// rate; only the tail-end cells past the threshold deviate. This gives
// a tight central cluster of normal-rate cells with a sparse minority
// of visibly fast/slow outliers, rather than smooth variation across
// the whole field.
#define MUTATE_HZ                0.95   // mutation rate inside trail in Hz
#define MUTATE_JITTER            0.85   // outlier rate variance, fraction of MUTATE_HZ
#define MUTATE_JITTER_THRESHOLD  0.7    // |hash| below this = no jitter; above = outlier
#define MUTATE_JITTER_BIAS       0.3    // push toward extreme jitters

// --- Mutation flash & crossfade ---------------------------------------------
// New glyphs crossfade over old over CROSSFADE_TIME. Mutations flash white
// -> cyan -> green when gated by the scrolling flash map. Heads always flash.
#define CROSSFADE_TIME      0.25   // crossfade duration in seconds
#define FLASH_DECAY         0.40   // tail flash decay in seconds
#define FLASH_HEAD_DECAY    0.35   // head flash decay in seconds — slower than tail
#define FLASH_PROB          0.12   // fraction of tail mutations that flash
#define FLASH_MAP_SCROLL    0.25  // flash map vertical scroll in cells/sec — 1 cell per 3s
#define FLASH_BOOST         2.3    // brightness multiplier at head flash peak
#define FLASH_BOOST_TAIL    1.6    // brightness multiplier at tail flash peak — was 1.8 when sharing head ramp; raised now that body flashes have their own blown-green ramp
#define FLASH_COLOUR_HOT    vec3(0.8, 1.0, 0.8)
#define FLASH_COLOUR_MID    vec3(0.55, 1.0, 0.95)
#define FLASH_BODY_HOT      vec3(0.65, 1.2, 0.45)   // body flash peak — blown-out matrix green for phosphor burn through bloom

// --- Dark field --------------------------------------------------------------
// Inverse of the flash gate, sampled from the *same* mapSample so a single
// hash drives both behaviours. Cells where mapSample is in the high end of
// [0,1] go dim instead of bright; cells in the low end flash; cells in the
// middle stay baseline green. Dim events trigger on the same body mutation
// bucket as flashes and decay similarly.
#define DARK_PROB           0.12   // fraction of tail mutations that dim
#define DARK_DECAY          0.40   // dim decay in seconds — keep close to FLASH_DECAY for visual parity
#define DARK_DEPTH          0.45   // brightness multiplier at peak dim — 0 = black, 1 = no effect

// --- Body brightness variance ------------------------------------------------
// Per-cell stable brightness multiplier applied to body cells. Breaks up the
// uniform "every body cell is exactly the same green" sterility without
// looking flickery — the value is fixed per cell.
#define BODY_BRIGHT_VAR     0.20   // 0.20 = body brightness varies in [1.0 - 0.20, 1.0]

// --- Bloom -------------------------------------------------------------------
// Single-pass cross-kernel bloom. The final fragment additively samples 4
// neighbour fragments at BLOOM_RADIUS pixels offset (±x, ±y), weighted by
// brightness². Bright pixels (head flashes) bleed into surrounding fragments
// with a soft falloff; dim pixels barely contribute. No render-to-texture,
// no zoom interaction.
#define BLOOM_RADIUS        3.0    // sample offset in pixels at REF_HEIGHT — scales with canvas height in main()
#define BLOOM_STRENGTH      0.65   // contribution of bloom samples added to base

// --- Layers ------------------------------------------------------------------
// Two layers now: foreground (depth 1.0) and background (depth 0.6).
// Background uses smaller cells so trails read as further away. Per request,
// background trails are shorter to enhance depth.
#define BG_DEPTH          0.575     // background layer depth — controls cell size and dim
#define BG_TRAIL_SCALE    0.55     // background trail length as fraction of foreground trail (in cells of the bg layer)

// --- CRT / scanline / breathing ---------------------------------------------
#define SCANLINE_DARK     0.45
#define SCANLINE_SWING    0.5
#define SCANLINE_SCALE    0.45
#define BREATHE_SCALE     0.65
#define BREATHE_SPEED     0.08
#define ATLAS_COLS        32.0

vec2 breathe(vec2 fragCoord) {
  vec2 centre = iResolution.xy * 0.5;
  // Midpoint-shifted so scale ranges in [1.0, 1.0 + BREATHE_SCALE]. The
  // minimum (and resting "natural" view) corresponds to scale = 1.0, so
  // breathing only zooms *in* and never reveals content outside the
  // natural viewport.
  float scale = 1.0 + BREATHE_SCALE * 0.5 + BREATHE_SCALE * 0.5 * sin(iTime * BREATHE_SPEED);

  return (fragCoord - centre) / scale + centre;
}

// Cheap 2D hash, range [0,1)
float hash21(vec2 p) {
  return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
}
// Cheap 3D hash, range [0,1)
float hash31(vec3 p) {
  return fract(sin(dot(p, vec3(127.1, 311.7, 74.3))) * 43758.5453);
}

// trailRole — given a column, a row index, and current time, find which trail
// (if any) currently owns this cell and return its role.
//
// Returns vec4(role, ageInTrail, fadeAlpha, Tk) where:
//   role        : 0 = dead/black, 1 = forced blank (eviction), 2 = head, 3 = body
//   ageInTrail  : 0 at head, ~1 at tail end (currently unused; left in the
//                 return value as cheap state for future tuning)
//   fadeAlpha   : brightness multiplier (1.0 in body, ramps to 0 over FADE_LEN at tail)
//   Tk          : trail start time of the winning trail. Used to compute when
//                 this row was last the head: Tk + (row + 1) / TRAIL_SPEED.
//
// We test the most recent TRAIL_LOOKBACK trails. Eviction wins over body
// (newer trail's eviction zone wipes older trail's body). Head wins over
// body. Closest head wins among multiple body claims.
vec4 trailRole(float colIdx, float row, float t, float trailLenScale) {
  // Per-column time-of-arrival phase offset, in [0, TRAIL_GAP_MEAN).
  // Without this, every column's k-th trail clusters near the same global
  // time multiple of TRAIL_GAP_MEAN — visible as horizontal "waves" of heads
  // sweeping across the screen. Shifting the schedule per column decorrelates
  // arrival times so any moment of time samples a uniform distribution of
  // "next-trail arrivals" across columns.
  float colPhase = hash21(vec2(colIdx, 1.7)) * TRAIL_GAP_MEAN;

  // Estimate the index of the most recent trail to have started in this column.
  // T_k(c) ≈ k * TRAIL_GAP_MEAN - colPhase + jitter(c, k) * TRAIL_GAP_VAR
  // So k ≈ (t + colPhase) / TRAIL_GAP_MEAN. Walk back from there.
  float kNow = floor((t + colPhase) / TRAIL_GAP_MEAN) + 1.0;

  float bestRole       = 0.0;
  float bestAge        = 0.0;
  float bestFade       = 0.0;
  float bestTk         = 0.0;
  float evictHit       = 0.0;  // separate flag — eviction always wins
  // Track the closest head (smallest positive distance from this row to a head)
  // so when multiple trails claim body, the one whose head is nearest above us
  // is chosen.
  float bestHeadDist   = 1e9;

  for (int i = 0; i < TRAIL_LOOKBACK; i++) {
    float k = kNow - float(i);
    // T_k jitter: per-(column, k) hash, scaled to [0, TRAIL_GAP_VAR].
    float jitter = hash21(vec2(colIdx, k * 17.0 + 3.0)) * TRAIL_GAP_VAR;
    float Tk = k * TRAIL_GAP_MEAN - colPhase + jitter;
    if (Tk > t) continue;  // not yet arrived

    // Per-trail length jitter
    float lenJ  = (hash21(vec2(colIdx, k * 31.0 + 7.0)) - 0.5) * 2.0 * TRAIL_LEN_VAR;
    float trailLen = TRAIL_LEN * trailLenScale * (1.0 + lenJ);

    // Head row at time t (continuous). floor() to integer cell.
    float headRowF = (t - Tk) * TRAIL_SPEED;
    float headRow  = floor(headRowF);

    // Distance from this fragment's row to the head (positive = below head).
    float distToHead = row - headRow;

    // Eviction zone: distToHead in (0, evictReach]. evictReach grows from
    // 0 at trail arrival up to EVICT_LEN as the head descends — avoids
    // snapping the full eviction band into existence at the moment a new
    // trail starts (which would wipe a chunk of the previous trail's body
    // instantaneously).
    float evictReach = min(EVICT_LEN, headRow);
    if (distToHead > 0.0 && distToHead <= evictReach) {
      evictHit = 1.0;
    }
    // Head: distToHead == 0
    else if (distToHead == 0.0) {
      if (0.0 < bestHeadDist) {  // any head beats no-head
        bestHeadDist = 0.0;
        bestRole     = 2.0;
        bestAge      = 0.0;
        bestFade     = 1.0;
        bestTk       = Tk;
      }
    }
    // Body: distToHead in [-trailLen, -1]
    else if (distToHead < 0.0 && -distToHead <= trailLen) {
      float ageCells = -distToHead;  // 1 = first cell behind head, trailLen = tail end
      float fadeStart = trailLen - FADE_LEN;
      float fade = 1.0;
      if (ageCells > fadeStart) {
        // Linear fade over last FADE_LEN cells.
        fade = clamp(1.0 - (ageCells - fadeStart) / FADE_LEN, 0.0, 1.0);
      }
      // Pick this trail only if its head is closer than the current best.
      if (ageCells < bestHeadDist) {
        bestHeadDist = ageCells;
        bestRole     = 3.0;
        bestAge      = ageCells / trailLen;
        bestFade     = fade;
        bestTk       = Tk;
      }
    }
  }

  // Eviction beats everything.
  if (evictHit > 0.5) {
    return vec4(1.0, 0.0, 0.0, 0.0);
  }
  return vec4(bestRole, bestAge, bestFade, bestTk);
}

// glyph() returns vec4(rgb, alpha) — colour already includes flash ramp +
// crossfade, alpha is the rendered glyph mask. If the cell is not inside a
// live trail, returns zero (nothing rendered).
vec4 glyph(float colIdx, float localX, float fragY, float cellW, float cellH, float margin, float trailLenScale) {
  // WebGL's fragCoord.y is 0 at the bottom; we want row 0 at the top so
  // trails advancing to higher row indices fall down the screen.
  float totalRows = floor(iResolution.y / cellH);
  float row = totalRows - 1.0 - floor(fragY / cellH);
  vec2  cell = vec2(colIdx, row);
  // UV inside the cell: x in [0, 1] across cellW, y in [0, 1] across cellH.
  vec2  uv   = vec2(localX / cellW, fract(fragY / cellH));
  vec2  fade2 = smoothstep(0.0, margin, uv) * smoothstep(1.0, 1.0 - margin, uv);
  float cellFade = fade2.x * fade2.y;
  uv = uv * 0.75 + 0.125;

  // Determine if this cell is inside a live trail and what role it plays.
  vec4 role = trailRole(colIdx, row, iTime, trailLenScale);
  if (role.x < 0.5) {
    return vec4(0.0);
  }
  if (role.x < 1.5) {
    // Eviction zone — rendered as forced blank, no glyph at all.
    return vec4(0.0);
  }
  // role.y = ageInTrail (0 at head, 1 at tail), role.z = fade alpha,
  // role.w = Tk (trail start time, used to derive when this cell was the head).
  float isHead     = role.x > 1.5 && role.x < 2.5 ? 1.0 : 0.0;
  float ageInTrail = role.y;
  float fadeAlpha  = role.z;
  float Tk         = role.w;

  // Per-cell mutation rate — banded jitter. Hash maps to a signed value
  // in [-1, +1]; only cells past the threshold get any deviation from
  // the base rate, and the deviation ramps from zero at the threshold
  // up to ±MUTATE_JITTER at the extremes. Result: most cells sit on
  // MUTATE_HZ exactly, a sparse minority are visibly faster or slower
  // outliers. Sign of the hash determines fast/slow. Heads still always
  // flash (see flashGate below); they just do not mutate any faster
  // than body cells.
  float rawHash    = hash21(cell + 29.0) * 2.0 - 1.0;            // [-1, +1]
  // Bias toward extremes: cube preserves sign and pulls mid-values outward.
  // pow > 1 = compress toward 0 (fewer outliers), pow < 1 = pull toward ±1 (more outliers)
  float jitterHash = sign(rawHash) * pow(abs(rawHash), MUTATE_JITTER_BIAS);
  float jitterMag  = abs(jitterHash);
  float jitterSign = sign(jitterHash);
  float jitterAmount = max(jitterMag - MUTATE_JITTER_THRESHOLD, 0.0)
                     / max(1.0 - MUTATE_JITTER_THRESHOLD, 0.0001); // [0, 1] past threshold
  float rateJitter   = jitterSign * jitterAmount * MUTATE_JITTER;
  float mutateHz     = MUTATE_HZ * (1.0 + rateJitter);

  // Per-cell phase, mutation bucket
  float phase  = hash21(cell + 13.0);
  float bucket = floor((iTime + phase / max(mutateHz, 0.0001)) * mutateHz);

  // Crossfade timing
  float bucketStart = (bucket - phase) / mutateHz;
  float sinceFlip   = max(iTime - bucketStart, 0.0);
  float xfade       = smoothstep(0.0, CROSSFADE_TIME, sinceFlip);

  // Sample current and previous glyphs
  vec2 curHash  = vec2(hash31(vec3(cell, bucket)),
                       hash31(vec3(cell, bucket + 99.0)));
  vec2 prevHash = vec2(hash31(vec3(cell, bucket - 1.0)),
                       hash31(vec3(cell, bucket - 1.0 + 99.0)));
  vec2 curPick  = floor(curHash  * ATLAS_COLS);
  vec2 prevPick = floor(prevHash * ATLAS_COLS);

  vec2 uvCur  = vec2(1.0 - (uv.x + curPick.x)  / ATLAS_COLS, (uv.y + curPick.y)  / ATLAS_COLS);
  vec2 uvPrev = vec2(1.0 - (uv.x + prevPick.x) / ATLAS_COLS, (uv.y + prevPick.y) / ATLAS_COLS);

  float gCur  = texture(iChannel0, uvCur ).r;
  float gPrev = texture(iChannel0, uvPrev).r;

  float intensity = (gPrev * (1.0 - xfade) + gCur * xfade) * cellFade;

  // Flash energy comes from two independent sources, taken as max:
  //
  //   (A) Head-arrival flash. Each cell, when the head first lands on it,
  //       starts a flash that decays continuously. While it's the head this
  //       gives the bright pulse; *after* the head moves on, the same decay
  //       continues — so the cell immediately behind the head still inherits
  //       a partially-decayed flash rather than snapping straight to green.
  //   (B) Body map-gated flash. A subtle, per-cell flash on the body's own
  //       mutation bucket flip, gated by the slowly-scrolling flash map.
  //       Independent of (A), only meaningful in the trail body.

  // (A) sinceHeadArrival — time since head touched this cell. Negative if the
  // head hasn't arrived yet (eviction zone — but those cells never reach here).
  float headArrival     = Tk + row / TRAIL_SPEED;
  float sinceHeadArrival = max(iTime - headArrival, 0.0);
  float headEnergy      = exp(-sinceHeadArrival / FLASH_HEAD_DECAY);

  // (B) Body map-gated flash — same as before, but only contributes when this
  // cell is a body cell. Per-cell phase scatters re-roll moments. mapSample
  // is shared with the dark gate below — single hash, two effects.
  float scrollPhase = hash21(cell + 41.0);
  float scrollSteps = floor(iTime * FLASH_MAP_SCROLL + scrollPhase);
  float mapSample   = hash21(vec2(cell.x + scrollSteps * 7.3, cell.y));
  float bodyGate    = step(mapSample, FLASH_PROB) * (1.0 - isHead);
  float bodyEnergy  = exp(-sinceFlip / FLASH_DECAY) * bodyGate;

  // Dark gate — uses the same mapSample, opposite end of [0,1]. A cell can
  // only ever take one of {flash, dim, baseline} per window since the gates
  // partition mapSample's range (FLASH_PROB + DARK_PROB should sum to < 1.0
  // to leave a baseline middle band). Dim energy decays from the body's own
  // bucket flip, same as bodyEnergy.
  float darkGate    = step(1.0 - DARK_PROB, mapSample) * (1.0 - isHead);
  float darkEnergy  = exp(-sinceFlip / DARK_DECAY) * darkGate;

  // Two independent flash sources, two independent colour ramps. Pick the
  // dominant one to drive both tint and boost, since head-carry and body-
  // map flash rarely co-occur with comparable energy.
  float headDominant = step(bodyEnergy, headEnergy);
  float flashEnergy  = max(headEnergy, bodyEnergy);

  // Head ramp: 3-stop white -> cyan -> green as energy goes 1 -> 0.5 -> 0.
  vec3 headLo   = mix(COLOR,           FLASH_COLOUR_MID, smoothstep(0.0, 0.5, headEnergy));
  vec3 headHi   = mix(FLASH_COLOUR_MID, FLASH_COLOUR_HOT, smoothstep(0.5, 1.0, headEnergy));
  vec3 headTint = headEnergy < 0.5 ? headLo : headHi;

  // Body ramp: 2-stop blown-out matrix green -> green. No cyan transition.
  // FLASH_BODY_HOT has channels >1.0; bloom amplifies the over-bright result.
  vec3 bodyTint = mix(COLOR, FLASH_BODY_HOT, smoothstep(0.0, 1.0, bodyEnergy));

  vec3 tint = headDominant > 0.5 ? headTint : bodyTint;

  float boost = 1.0 + flashEnergy * mix(FLASH_BOOST_TAIL - 1.0, FLASH_BOOST - 1.0, headDominant);

  // Per-cell brightness variance — stable hash, breaks up uniform body green.
  // Applied as a multiplier in [1 - BODY_BRIGHT_VAR, 1]. Bright flashes are
  // mostly white so the small dim-direction multiplier is barely visible
  // during flashes; the effect is meaningful for body green.
  float bodyVar = 1.0 - BODY_BRIGHT_VAR * hash21(cell + 67.0);

  // Apply dark gate as a brightness multiplier. darkEnergy peaks at 1.0 just
  // after the cell's bucket flips (when in a dark window), decaying with
  // DARK_DECAY. At peak the cell is multiplied by (1 - DARK_DEPTH).
  float darkMul = 1.0 - darkEnergy * DARK_DEPTH;

  // Apply trail tail-fade to the final colour. Body cells have fadeAlpha=1,
  // tail-fade cells ramp to 0.
  return vec4(tint * boost * fadeAlpha * bodyVar * darkMul, intensity * fadeAlpha);
}

vec4 sampleLayer(vec2 coord, float depth, float margin, float trailLenScale) {
  // Vertical cell size derived from canvas height so the same row count fits
  // at any resolution. Horizontal cell size is squashed by COL_DENSITY for
  // tighter column packing.
  float cellH = REF_CELL * (iResolution.y / REF_HEIGHT) * depth;
  float cellW = cellH * COL_DENSITY;
  float c       = floor(coord.x / cellW);
  float localX  = coord.x - c * cellW;
  float dim     = depth * depth * (depth < 1.0 ? 1.0 : 0.6);
  vec4  g       = glyph(c, localX, coord.y, cellW, cellH, margin, trailLenScale);
  // g.rgb already includes flash colour and tail fade; g.a is glyph mask.
  return vec4(g.rgb * g.a * dim, g.a);
}

// Composes the two-layer scene at a given fragCoord. Pulled out of main()
// so it can be sampled multiple times for the bloom pass. Returns the layer-
// composited colour (pre-scanline, pre-bloom).
vec3 sceneAt(vec2 fragCoord) {
  vec2 coord = breathe(fragCoord);
  vec4 lb = sampleLayer(coord, BG_DEPTH, 0.20, BG_TRAIL_SCALE);
  vec4 lf = sampleLayer(coord, 1.0,      0.30, 1.0);
  vec3 col = lf.rgb + lb.rgb * (1.0 - lf.a);
  return col;
}

void main() {
  vec2 fragCoord = gl_FragCoord.xy;

  // Centre sample
  vec3 base = sceneAt(fragCoord);

  // Cross-kernel bloom: 4 neighbours at BLOOM_RADIUS pixels (scaled with
  // canvas height so the cell-relative bleed stays the same at any
  // resolution), weighted by their luminance squared so dim pixels barely
  // contribute. Same-pass so breathing zoom and bloom stay in lockstep.
  float bloomR = BLOOM_RADIUS * (iResolution.y / REF_HEIGHT);
  vec3 nL = sceneAt(fragCoord + vec2(-bloomR, 0.0));
  vec3 nR = sceneAt(fragCoord + vec2( bloomR, 0.0));
  vec3 nU = sceneAt(fragCoord + vec2(0.0,  bloomR));
  vec3 nD = sceneAt(fragCoord + vec2(0.0, -bloomR));

  // Luminance² weight — heavy threshold-like bias toward bright sources.
  // Using max-channel as a cheap luminance proxy works well for this palette
  // since the brightest pixels are near-white (head flashes).
  float wL = pow(max(max(nL.r, nL.g), nL.b), 2.0);
  float wR = pow(max(max(nR.r, nR.g), nR.b), 2.0);
  float wU = pow(max(max(nU.r, nU.g), nU.b), 2.0);
  float wD = pow(max(max(nD.r, nD.g), nD.b), 2.0);

  vec3 bloom = nL * wL + nR * wR + nU * wU + nD * wD;

  vec3 col = base + bloom * BLOOM_STRENGTH;

  // Scanline + vmask, applied to bloomed result so the lines also affect
  // bright bleed (matches CRT — the whole image is on the same scanline grid).
  float sY = sin(fragCoord.y * 3.14159 * SCANLINE_SCALE) * 0.5 + 0.5;
  float scanline = SCANLINE_DARK + SCANLINE_SWING * pow(sY, 2.5);
  float vmask = 0.92 + 0.08 * sin(fragCoord.x * 3.14159 * SCANLINE_SCALE);
  float compensation = (SCANLINE_DARK + SCANLINE_SWING * 0.5);
  col *= scanline * vmask / compensation;

  fragColor = vec4(col, 1.0);
}

			// ─── Compile ──────────────────────────────────────────────────────────────────
			function compile(type, src) {
				const s = gl.createShader(type);
				gl.shaderSource(s, src);
				gl.compileShader(s);
				if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
				return s;
			}
			const prog = gl.createProgram();
			gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
			gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
			gl.linkProgram(prog);
			if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));

			// ─── Fullscreen quad ──────────────────────────────────────────────────────────
			const vao = gl.createVertexArray();
			gl.bindVertexArray(vao);
			const buf = gl.createBuffer();
			gl.bindBuffer(gl.ARRAY_BUFFER, buf);
			gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
			const loc = gl.getAttribLocation(prog, "aPos");
			gl.enableVertexAttribArray(loc);
			gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

			// ─── Uniforms + textures ──────────────────────────────────────────────────────
			gl.useProgram(prog);
			const uRes = gl.getUniformLocation(prog, "iResolution");
			const uTime = gl.getUniformLocation(prog, "iTime");
			gl.uniform1i(gl.getUniformLocation(prog, "iChannel0"), 0);

			const glyphTex = buildGlyphTexture();

			// ─── Canvas sizing: match device pixels, react to resize ──────────────────────
			function resize() {
				const dpr = window.devicePixelRatio || 1;
				const w = Math.floor(window.innerWidth * dpr);
				const h = Math.floor(window.innerHeight * dpr);
				if (canvas.width !== w || canvas.height !== h) {
					canvas.width = w;
					canvas.height = h;
					gl.viewport(0, 0, w, h);
				}
			}
			resize();
			window.addEventListener("resize", resize);

			// ─── Render loop ──────────────────────────────────────────────────────────────
			let start = null;
			function frame(ts) {
				if (!start) start = ts;
				const t = (ts - start) / 1000.0;

				gl.useProgram(prog);
				gl.bindVertexArray(vao);

				gl.activeTexture(gl.TEXTURE0);
				gl.bindTexture(gl.TEXTURE_2D, glyphTex);

				gl.uniform2f(uRes, canvas.width, canvas.height);
				gl.uniform1f(uTime, t);

				gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
				requestAnimationFrame(frame);
			}
			requestAnimationFrame(frame);
		</script>
